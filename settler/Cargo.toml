[package]
name = "eez-dex-settler"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "The eez-dex settler: watches the window, builds and simulates the settlement leg, submits it to the L2->L1 front, and reconciles the outcome."

[[bin]]
name = "eez-dex-settler"
path = "src/main.rs"

[lib]
name = "eez_dex_settler"
path = "src/lib.rs"

[features]
default = []
# The fake chains the tests drive the service with. Enabled for this crate's
# own test builds through the dev-dependency below, so the shipped library and
# binary carry none of it.
testkit = []
# TS-3's integration suites: restart-mid-window and known-dropped resubmission
# against a running enclave. Off by default so `make check` stays offline and
# fast; see settler/README.md for how to run them.
enclave = ["testkit"]

# The alloy stack, at the majors the pinned node resolves (FRAMEWORK_COMMIT ->
# eez-rollup0's workspace Cargo.toml): primitives and sol-types on 1.x,
# provider / network / signer on 2.x. Mismatched majors put two copies of the
# alloy types in one dependency graph, which is the failure the node's own
# manifest warns about.
[dependencies]
alloy-consensus = { version = "=2.0.5", default-features = false }
alloy-eips = { version = "=2.0.5", default-features = false }
alloy-network = { version = "2", default-features = false }
alloy-primitives = { version = "1", default-features = false, features = ["std", "map"] }
alloy-provider = { version = "2", default-features = false, features = ["reqwest"] }
alloy-rpc-types-eth = { version = "2", default-features = false }
alloy-signer-local = { version = "2", default-features = false }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The crate depends on itself with `testkit` on so integration tests can reach
# the fakes without the library shipping them. A self dev-dependency is the
# supported way to say that.
[dev-dependencies]
eez-dex-settler = { path = ".", features = ["testkit"] }

[lints.rust]
missing_docs = "warn"
